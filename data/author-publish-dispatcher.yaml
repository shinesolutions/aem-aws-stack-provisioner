---
# yamllint disable rule:line-length
# (hiera keys with lookup() interpolations do not fit in 80 characters)
# AEM Author Publish Dispatcher
author_publish_dispatcher::base_dir: "%{lookup('common::base_dir')}"
author_publish_dispatcher::log_dir: "%{lookup('common::log_dir')}"
author_publish_dispatcher::tmp_dir: "%{lookup('common::tmp_dir')}"
author_publish_dispatcher::docroot_dir: "%{lookup('common::docroot_dir')}"
author_publish_dispatcher::credentials_file: "%{lookup('common::credentials_file')}"
author_publish_dispatcher::publish_replication_agent_protocol: https
author_publish_dispatcher::publish_replication_agent_port: 5443
author_publish_dispatcher::aws_region: "%{lookup('common::aws_region')}"
author_publish_dispatcher::aws_tags: "%{alias('common::aws_tags')}"

# device_alias <- used by snapshot_attach.py Depending on the block device driver of the kernel, the device could be attached with a different name than you specified.
author_publish_dispatcher::aem_repo_devices:
  - device_name: "%{lookup('common::ami::author_device_name')}"
    device_alias: "%{lookup('common::ami::author_device_alias')}"
    aem_id: author
  - device_name: "%{lookup('common::ami::publish_device_name')}"
    device_alias: "%{lookup('common::ami::publish_device_alias')}"
    aem_id: publish

author_publish_dispatcher::dispatcher_data_devices:
  - device_name: "%{lookup('common::ami::publish_dispatcher_device_name')}"
    device_alias: "%{lookup('common::ami::publish_dispatcher_device_alias')}"

author_publish_dispatcher::volume_type: gp2

author_publish_dispatcher::aem_password_retrieval_command: "%{lookup('common::aem_password_retrieval_command')}"
author_publish_dispatcher::awslogs_config_path: "%{lookup('common::awslogs_config_path')}"
author_publish_dispatcher::enable_cloudwatch_s3_stream: "%{alias('orchestrator::enable_cloudwatch_s3_stream')}"
# Scheduled jobs
action_scheduled_jobs::offline_compaction_snapshot_enable: "%{alias('aem_orchestrator::scheduled_jobs::enable::offline_compaction_snapshot')}"
action_scheduled_jobs::offline_compaction_snapshot_weekday: "%{lookup('aem_orchestrator::scheduled_jobs::weekday::offline_compaction_snapshot')}"
action_scheduled_jobs::offline_compaction_snapshot_hour: "%{lookup('aem_orchestrator::scheduled_jobs::hour::offline_compaction_snapshot')}"
action_scheduled_jobs::offline_compaction_snapshot_minute: "%{lookup('aem_orchestrator::scheduled_jobs::minute::offline_compaction_snapshot')}"
action_scheduled_jobs::offline_snapshot_enable: "%{alias('aem_orchestrator::scheduled_jobs::enable::offline_snapshot')}"
action_scheduled_jobs::offline_snapshot_weekday: "%{lookup('aem_orchestrator::scheduled_jobs::weekday::offline_snapshot')}"
action_scheduled_jobs::offline_snapshot_hour: "%{lookup('aem_orchestrator::scheduled_jobs::hour::offline_snapshot')}"
action_scheduled_jobs::offline_snapshot_minute: "%{lookup('aem_orchestrator::scheduled_jobs::minute::offline_snapshot')}"
action_scheduled_jobs::export_enable: "%{alias('publish::scheduled_jobs::enable::export')}"
action_scheduled_jobs::export_weekday: "%{lookup('publish::scheduled_jobs::weekday::export')}"
action_scheduled_jobs::export_hour: "%{lookup('publish::scheduled_jobs::hour::export')}"
action_scheduled_jobs::export_minute: "%{lookup('publish::scheduled_jobs::minute::export')}"
action_scheduled_jobs::live_snapshot_enable: "%{alias('publish::scheduled_jobs::enable::live_snapshot')}"
action_scheduled_jobs::live_snapshot_weekday: "%{lookup('publish::scheduled_jobs::weekday::live_snapshot')}"
action_scheduled_jobs::live_snapshot_hour: "%{lookup('publish::scheduled_jobs::hour::live_snapshot')}"
action_scheduled_jobs::live_snapshot_minute: "%{lookup('publish::scheduled_jobs::minute::live_snapshot')}"
action_scheduled_jobs::cloudwatch_s3_stream_enable: "%{alias('orchestrator::enable_cloudwatch_s3_stream')}"
action_scheduled_jobs::cloudwatch_s3_stream_weekday: "%{lookup('aem_orchestrator::scheduled_jobs::weekday::cloudwatch_s3_stream')}"
action_scheduled_jobs::cloudwatch_s3_stream_hour: "%{lookup('aem_orchestrator::scheduled_jobs::hour::cloudwatch_s3_stream')}"
action_scheduled_jobs::cloudwatch_s3_stream_minute: "%{lookup('aem_orchestrator::scheduled_jobs::minute::cloudwatch_s3_stream')}"

aem_curator::action_enable_crxde::aem_instances:
  - run_mode: author
    aem_id: author
  - run_mode: publish
    aem_id: publish

aem_curator::action_disable_crxde::aem_instances:
  - run_mode: author
    aem_id: author
  - run_mode: publish
    aem_id: publish

aem_curator::action_list_packages::aem_instances:
  - run_mode: author
    aem_id: author
  - run_mode: publish
    aem_id: publish

aem_curator::action_deploy_artifacts::author_host: "%{lookup('common::author_host')}"
aem_curator::action_deploy_artifacts::publish_host: "%{lookup('common::publish_host')}"

aem_curator::action_export_backup::tmp_dir: "%{lookup('common::tmp_dir')}"

aem_curator::action_export_backups::tmp_dir: "%{lookup('common::tmp_dir')}"
aem_curator::action_export_backups::download_descriptor::tmp_dir: "%{lookup('common::tmp_dir')}"

aem_curator::action_import_backup::tmp_dir: "%{lookup('common::tmp_dir')}"

aem_curator::config_aem_tools::aem_instances:
  - crx_quickstart_dir: /opt/aem/author/crx-quickstart
    user: aem-author
    aem_id: author
  - crx_quickstart_dir: /opt/aem/publish/crx-quickstart
    user: aem-publish
    aem_id: publish

aem_curator::config_aem_upgrade_tools::aem_instances:
  - aem_port: 4502
    aem_id: author
  - aem_port: 4503
    aem_id: publish

aem_curator::config_collectd::aem_instances:
  - aem_id: author
    jmxremote_port: "%{lookup('aem_curator::config_author_primary::jmxremote_port')}"
    instance_prefixes:
      - memory-heap
  - aem_id: publish
    jmxremote_port: "%{lookup('aem_curator::config_publish::jmxremote_port')}"
    instance_prefixes:
      - memory-heap

# AEM Author
aem_curator::config_author_primary::tmp_dir: "%{lookup('common::tmp_dir')}"
aem_curator::config_author_primary::aem_base: "%{lookup('common::aem_base')}"
aem_curator::config_author_primary::aem_home_dir: /opt/aem/author
aem_curator::config_author_primary::puppet_conf_dir: "%{lookup('common::puppet_conf_dir')}"
aem_curator::config_author_primary::crx_quickstart_dir: /opt/aem/author/crx-quickstart
aem_curator::config_author_primary::author_protocol: http
aem_curator::config_author_primary::author_port: 4502
aem_curator::config_author_primary::author_ssl_port: 5432
aem_curator::config_author_primary::credentials_file: "%{lookup('common::credentials_file')}"
aem_curator::config_author_primary::enable_deploy_flag: false
aem_curator::config_author_primary::login_ready_max_tries: "%{lookup('author_primary::login_ready_max_tries')}"
aem_curator::config_author_primary::login_ready_base_sleep_seconds: "%{lookup('author_primary::login_ready_base_sleep_seconds')}"
aem_curator::config_author_primary::login_ready_max_sleep_seconds: "%{lookup('author_primary::login_ready_max_sleep_seconds')}"
aem_curator::config_author_primary::enable_crxde: false
aem_curator::config_author_primary::enable_default_passwords: false
aem_curator::config_author_primary::aem_password_reset_source: "s3://%{::data_bucket_name}/%{::stack_prefix}/aem-password-reset-content-%{lookup('aem_curator::config_author_primary::aem_password_reset_version')}.zip"
aem_curator::config_author_primary::aem_password_reset_version: '1.0.2'
aem_curator::config_author_primary::aem_healthcheck_source: "s3://%{::data_bucket_name}/%{::stack_prefix}/aem-healthcheck-content-%{lookup('aem_curator::config_author_primary::aem_healthcheck_version')}.zip"
aem_curator::config_author_primary::aem_healthcheck_version: "%{lookup('common::aem_healthcheck_version')}"
aem_curator::config_author_primary::aem_ssl_keystore_password: "%{lookup('common::aem_ssl_keystore_password')}"
aem_curator::config_author_primary::enable_aem_reconfiguration: "%{alias('common::enable_aem_reconfiguration')}"
aem_curator::config_author_primary::enable_aem_clean_directories: true
aem_curator::config_author_primary::enable_aem_installation_migration: "%{alias('common::enable_aem_reconfiguration')}"
aem_curator::config_author_primary::certificate_arn: "%{lookup('common::certificate_arn')}"
aem_curator::config_author_primary::certificate_key_arn: "%{lookup('common::certificate_key_arn')}"
aem_curator::config_author_primary::aem_system_users: "%{alias('author::aem_system_users')}"
aem_curator::config_author_primary::data_volume_mount_point: /mnt/ebs1
aem_curator::config_author_primary::jmxremote_enable_authentication: true
aem_curator::config_author_primary::jmxremote_monitoring_username: "%{lookup('common::jmxremote::user')}"
aem_curator::config_author_primary::jmxremote_monitoring_user_password: "%{lookup('common::jmxremote::user_password')}"
aem_curator::config_author_primary::jmxremote_enable_ssl: true
aem_curator::config_author_primary::jmxremote_keystore_path: /etc/ssl/aem-author/jmx.ks

# Configure AEM Author Agents
aem_curator::config_author_primary::enable_remove_all_agents: true

# AEM Publish
aem_curator::config_publish::publish_dispatcher_host: localhost
aem_curator::config_publish::publish_dispatcher_id: localhost
aem_curator::config_publish::tmp_dir: "%{lookup('common::tmp_dir')}"
aem_curator::config_publish::aem_base: "%{lookup('common::aem_base')}"
aem_curator::config_publish::aem_home_dir: /opt/aem/publish
aem_curator::config_publish::puppet_conf_dir: "%{lookup('common::puppet_conf_dir')}"
aem_curator::config_publish::crx_quickstart_dir: /opt/aem/publish/crx-quickstart
aem_curator::config_publish::publish_protocol: http
aem_curator::config_publish::publish_port: 4503
aem_curator::config_publish::publish_ssl_port: 5433
aem_curator::config_publish::credentials_file: "%{lookup('common::credentials_file')}"
aem_curator::config_publish::enable_deploy_flag: false
aem_curator::config_publish::login_ready_max_tries: "%{lookup('publish::login_ready_max_tries')}"
aem_curator::config_publish::login_ready_base_sleep_seconds: "%{lookup('publish::login_ready_base_sleep_seconds')}"
aem_curator::config_publish::login_ready_max_sleep_seconds: "%{lookup('publish::login_ready_max_sleep_seconds')}"
aem_curator::config_publish::enable_aem_clean_directories: true
aem_curator::config_publish::enable_crxde: false
aem_curator::config_publish::enable_default_passwords: false
aem_curator::config_publish::aem_password_reset_source: "s3://%{::data_bucket_name}/%{::stack_prefix}/aem-password-reset-content-%{lookup('aem_curator::config_publish::aem_password_reset_version')}.zip"
aem_curator::config_publish::aem_password_reset_version: '1.0.2'
aem_curator::config_publish::aem_healthcheck_source: "s3://%{::data_bucket_name}/%{::stack_prefix}/aem-healthcheck-content-%{lookup('aem_curator::config_publish::aem_healthcheck_version')}.zip"
aem_curator::config_publish::aem_healthcheck_version: "%{lookup('common::aem_healthcheck_version')}"
aem_curator::config_publish::aem_ssl_keystore_password: "%{lookup('common::aem_ssl_keystore_password')}"
aem_curator::config_publish::enable_aem_reconfiguration: "%{alias('common::enable_aem_reconfiguration')}"
aem_curator::config_publish::enable_aem_installation_migration: "%{alias('common::enable_aem_reconfiguration')}"
aem_curator::config_publish::certificate_arn: "%{lookup('common::certificate_arn')}"
aem_curator::config_publish::certificate_key_arn: "%{lookup('common::certificate_key_arn')}"
aem_curator::config_publish::aem_system_users: "%{alias('publish::aem_system_users')}"
aem_curator::config_publish::data_volume_mount_point: /mnt/ebs2
aem_curator::config_publish::jmxremote_enable_authentication: true
aem_curator::config_publish::jmxremote_monitoring_username: "%{lookup('common::jmxremote::user')}"
aem_curator::config_publish::jmxremote_monitoring_user_password: "%{lookup('common::jmxremote::user_password')}"
aem_curator::config_publish::jmxremote_enable_ssl: true
aem_curator::config_publish::jmxremote_keystore_path: /etc/ssl/aem-publish/jmx.ks

# Configure AEM Publish Agents
aem_curator::config_publish::enable_create_flush_agents: true
aem_curator::config_publish::enable_create_outbox_replication_agents: true
aem_curator::config_publish::enable_remove_all_agents: true

# AEM Publish-Dispatcher
aem_curator::config_publish_dispatcher::dispatcher_conf_dir: "%{lookup('common::dispatcher_conf_dir')}"
aem_curator::config_publish_dispatcher::enable_deploy_flag: false
aem_curator::config_publish_dispatcher::publish_host: "%{lookup('common::publish_host')}"
aem_curator::config_publish_dispatcher::publish_port: "%{lookup('common::publish_port')}"
aem_curator::config_publish_dispatcher::publish_secure: "%{lookup('common::publish_secure')}"
aem_curator::config_publish_dispatcher::ssl_cert: "%{lookup('common::dispatcher_ssl_cert')}"
aem_curator::config_publish_dispatcher::tmp_dir: "%{lookup('common::tmp_dir')}"
aem_curator::config_publish_dispatcher::virtual_hosts_dir: "%{lookup('common::virtual_hosts_dir')}"

aem_curator::config_aem_scheduled_jobs::offline_compaction_enable: "%{alias('publish::scheduled_jobs::enable::offline_compaction')}"
aem_curator::config_aem_scheduled_jobs::offline_compaction_weekday: "%{lookup('publish::scheduled_jobs::weekday::offline_compaction')}"
aem_curator::config_aem_scheduled_jobs::offline_compaction_hour: "%{lookup('publish::scheduled_jobs::hour::offline_compaction')}"
aem_curator::config_aem_scheduled_jobs::offline_compaction_minute: "%{lookup('publish::scheduled_jobs::minute::offline_compaction')}"

# Logrotation configuration
# TODO: remove the duplicate keys once it is decided which rules should apply
# Duplicate keys kept as before, only the last one takes effect (changing this changes behaviour)
aem_curator::config_logrotate::rules: "%{alias('author_primary::logrotation::rules')}"
aem_curator::config_logrotate::rules: "%{alias('publish::logrotation::rules')}"  # yamllint disable-line rule:key-duplicates
aem_curator::config_logrotate::rules: "%{alias('publish_dispatcher::logrotation::rules')}"  # yamllint disable-line rule:key-duplicates

# AEM authorizable keystore configuration parameters
aem_curator::config_author_primary::enable_authorizable_keystore_creation: "%{alias('common::authorizable_keystore::enable_creation')}"
aem_curator::config_author_primary::enable_authorizable_keystore_certificate_chain_upload: "%{alias('common::authorizable_keystore::enable_certificate_chain_upload')}"

# AEM truststore configuration parameters
aem_curator::config_author_primary::enable_truststore_creation: "%{alias('common::truststore::enable_creation')}"
aem_curator::config_author_primary::enable_truststore_migration: "%{alias('common::truststore::enable_migration')}"
aem_curator::config_author_primary::truststore_password: "%{lookup('common::truststore::password')}"

# AEM reconfiguration parameter
aem_curator::config_author_primary::enable_truststore_removal: "%{alias('common::enable_truststore_removal')}"
aem_curator::config_publish::enable_truststore_removal: "%{alias('common::enable_truststore_removal')}"

# SAML configuration
aem_curator::config_author_primary::enable_saml: "%{alias('common::saml::enable')}"
aem_curator::config_author_primary::saml_configuration: "%{alias('common::saml::configuration')}"
aem_curator::config_author_primary::enable_saml_certificate_upload: "%{alias('common::saml::enable_saml_certificate_upload')}"

# AEM Bundle configuration
aem_curator::config_author_primary::proxy_enabled: "%{alias('common::proxy_enabled')}"
aem_curator::config_author_primary::proxy_host: "%{lookup('common::proxy_host')}"
aem_curator::config_author_primary::proxy_port: "%{lookup('common::proxy_port')}"
aem_curator::config_author_primary::proxy_user: "%{lookup('common::proxy_user')}"
aem_curator::config_author_primary::proxy_password: "%{lookup('common::proxy_password')}"
aem_curator::config_author_primary::proxy_noproxy: "%{alias('common::proxy_noproxy')}"

# Service start Post sleep configuration
aem_curator::config_author_primary::enable_post_start_sleep: "%{alias('common::enable_post_start_sleep')}"
aem_curator::config_author_primary::post_start_sleep_seconds: "%{lookup('common::post_start_sleep_seconds')}"
aem_curator::config_publish::enable_post_start_sleep: "%{alias('common::enable_post_start_sleep')}"
aem_curator::config_publish::post_start_sleep_seconds: "%{lookup('common::post_start_sleep_seconds')}"
