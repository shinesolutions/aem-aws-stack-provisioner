---
author_dispatcher::base_dir: "%{lookup('common::base_dir')}"
author_dispatcher::docroot_dir: "%{lookup('common::docroot_dir')}"
author_dispatcher::log_dir: "%{lookup('common::log_dir')}"
author_dispatcher::awslogs_config_path: "%{lookup('common::awslogs_config_path')}"
author_dispatcher::aws_region: "%{lookup('common::aws_region')}"
author_dispatcher::tmp_dir: "%{lookup('common::tmp_dir')}"

# Configure Author Dispatcher
aem_curator::config_author_dispatcher::base_dir: "%{lookup('common::base_dir')}"
aem_curator::config_author_dispatcher::tmp_dir: "%{lookup('common::tmp_dir')}"
aem_curator::config_author_dispatcher::virtual_hosts_dir: "%{lookup('common::virtual_hosts_dir')}"
aem_curator::config_author_dispatcher::dispatcher_conf_dir: "%{lookup('common::dispatcher_conf_dir')}"
aem_curator::config_author_dispatcher::ssl_cert: "%{lookup('common::dispatcher_ssl_cert')}"
# Author ELB is listening on port 80/443 due to AEM using X-Forwarded-Port to construct location header
aem_curator::config_author_dispatcher::author_port: "%{lookup('common::author_port')}"
aem_curator::config_author_dispatcher::author_secure: "%{lookup('common::author_secure')}"
aem_curator::config_author_dispatcher::enable_deploy_flag: false

# Logrotation configuration
aem_curator::config_logrotate::config: "%{alias('author_dispatcher::logrotation::config')}"
aem_curator::config_logrotate::rules: "%{alias('author_dispatcher::logrotation::rules')}"

# device_alias <- used by snapshot_attach.py Depending on the block device driver of the kernel, the device could be attached with a different name than you specified.
author_dispatcher::dispatcher_data_devices:
  - device_name: "%{lookup('common::ami::device_name')}"
    device_alias: "%{lookup('common::ami::device_alias')}"
