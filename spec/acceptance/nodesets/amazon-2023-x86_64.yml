---
# A stand-in for the AEM AMIs (packer-aem): Amazon Linux 2023 with what the
# AMIs provide for the provisioner, except AEM and the Oracle JDK (see the
# Testing section of README.md)
HOSTS:
  amazon-2023-x86_64:
    roles:
      - default
    # Must match the image's OS: beaker uses it to pick the OpenVox repo
    platform: amazon-2023-x86_64
    image: amazonlinux:2023
    hypervisor: docker
    # Keep the built image so these layers are cached between runs
    docker_preserve_image: true
    docker_image_commands:
      # amazonlinux:2023 ships without systemd, so /sbin/init has to be
      # installed
      - dnf install -y systemd
      # OpenVox 9 is baked in, as on the AMIs (the release package URL can't
      # be wrapped)
      # yamllint disable-line rule:line-length
      - dnf install -y https://yum.voxpupuli.org/openvox9-release-amazon-2023.noarch.rpm
      - dnf install -y openvox-agent
      # Part of the Amazon Linux 2023 AMIs but not of the image: InSpec's port
      # resource (the dispatcher control) lists the listening ports with ss
      - dnf install -y iproute
      # The AMIs' default user (common::user), which pre-common.pp sets up the
      # AWS CLI configuration for
      - useradd ec2-user
      # The system services the provisioning relies on, at the latest
      # versions in the Amazon Linux 2023 repositories. cronie isn't installed
      # on Amazon Linux 2023 by default; collectd is baked stopped, the
      # provisioning starts it (aem_curator::config_collectd)
      # yamllint disable-line rule:line-length
      - dnf install -y cronie httpd mod_ssl collectd collectd-java collectd-generic-jmx amazon-cloudwatch-agent
      - systemctl enable crond
      # The CloudWatch writer plugin for collectd, which packer-aem bakes in
      # from the same (archived) repository, with collectd-python to run it.
      # aem_curator::config_collectd configures it
      - dnf install -y collectd-python tar gzip
      # yamllint disable-line rule:line-length
      - mkdir -p /opt/collectd-cloudwatch && curl -fsSL https://github.com/awslabs/collectd-cloudwatch/archive/master.tar.gz | tar -xz --strip-components=1 -C /opt/collectd-cloudwatch
      # collectd's GenericJMX plugin needs libjvm. The AMIs use the Oracle JDK
      # (an Oracle account is needed for it), so Amazon Corretto 11 stands in,
      # with libjvm on the dynamic linker path as aem_curator::install_aem_java
      # does
      - dnf install -y java-11-amazon-corretto-headless
      # yamllint disable-line rule:line-length
      - echo /usr/lib/jvm/java-11-amazon-corretto.x86_64/lib/server/ > /etc/ld.so.conf.d/99-libjvm.conf && ldconfig
      # Cinc InSpec at the version the instances need, which runs the
      # component InSpec tests (it also provides the inspec command)
      # yamllint disable-line rule:line-length
      - curl -fsSL -o /tmp/install.sh https://omnitruck.cinc.sh/install.sh && bash /tmp/install.sh -P cinc-auditor -v 7.2.1 && rm /tmp/install.sh
    docker_cmd: '["/sbin/init"]'
    image_outer_ports:
      - 22
CONFIG:
  type: aio
