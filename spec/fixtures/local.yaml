# The stack's hiera data (data/local.yaml on the instances) for the acceptance tests, generated, don't edit.
# Rendered from aem-aws-stack-builder 5b0c46a templates/ansible/stack-provisioner-hieradata.j2 with its default
# configuration (conf/ansible/inventory/group_vars/all.yaml and apps.yaml, os_type amazon-linux2 as it has no
# Amazon Linux 2023 entry), plus the aws.tags a stack configuration has to set, as Ansible renders it (the
# random JMX password is fixed). Regenerate it the same way when aem-aws-stack-builder changes the template.
# Common configuration parameters
common::aws_region: ap-southeast-2
common::aws_tags:
  -   Key: Project
      Value: aem-aws-stack-provisioner-acceptance

common::proxy_enabled: False
common::proxy_protocol: ''
common::proxy_host: ''
common::proxy_port: ''
common::proxy_user: ''
common::proxy_password: ''
common::proxy_noproxy:
  - localhost
  - 127.0.0.1

common::aem_healthcheck_version: 1.3.3
common::enable_aem_reconfiguration: False
common::enable_truststore_removal: False
common::certificate_arn: overwrite-me
common::certificate_key_arn: overwrite-me
common::aem_ssl_keystore_password: changeit

# JMX Configuration
common::jmxremote::user_password: jmxpassword1

# Configure Wait until login page is ready timeout for AEM Author & Publisher
common::login_ready_max_tries: '60'
common::login_ready_base_sleep_seconds: '5'
common::login_ready_max_sleep_seconds: '10'

# Configure Device names. device alias is used by snapshot_attach.py Depending on the block device driver of the kernel, the device could be attached with a different name than you specified.
common::ami::device_name: /dev/xvdb
common::ami::device_alias: /dev/xvdb
common::ami::author_device_name: /dev/xvdb
common::ami::author_device_alias: /dev/xvdb
common::ami::publish_device_name: /dev/xvdc
common::ami::publish_device_alias: /dev/xvdc
common::ami::publish_dispatcher_device_name: /dev/xvdd
common::ami::publish_dispatcher_device_alias: /dev/xvdd

# Service start Post sleep configuration
common::enable_post_start_sleep: True
common::post_start_sleep_seconds: 180

# ssh_public_keys Import
common::ssh_public_keys:
  ec2-user:
      public_key: overwrite-me
      public_key_type: ssh-rsa


# Keystore parameters
common::authorizable_keystore::enable_creation: False
common::authorizable_keystore::enable_certificate_chain_upload: False

# Truststore parameters
common::truststore::enable_creation: False
common::truststore::enable_migration: False
