---
name: CI
on: [push, pull_request, workflow_dispatch]
# GITHUB_TOKEN is read-only; workflows that write to the repository use
# SHINEOPENSOURCE_GITHUB_TOKEN instead
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.SHINEOPENSOURCE_GITHUB_TOKEN }}
      - uses: cliffano/command-docker-action@v2.1.0
        with:
          command: 'make ci'
          image: shinesolutions/aem-platform-buildenv:6.5.0
          shell: bash
