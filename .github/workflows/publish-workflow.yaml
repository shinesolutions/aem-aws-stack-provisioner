---
name: Publish
'on':
  push:
    tags:
      - '*'
jobs:
  build:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: 8.1.0
          set-safe-directory: ${{ github.workspace }}
      - uses: cliffano/command-docker-action@v2.1.0
        with:
          image: shinesolutions/aem-platform-buildenv:6.4.1
          shell: bash
          extra_args: -e GITHUB_TOKEN
          command: |
            make clean deps lint package publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
