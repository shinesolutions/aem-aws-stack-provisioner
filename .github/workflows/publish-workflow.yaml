---
name: Publish
'on':
  push:
    tags:
      - '*'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          set-safe-directory: ${{ github.workspace }}
      - uses: cliffano/command-docker-action@v2.1.0
        with:
          image: shinesolutions/aem-platform-buildenv:6.5.0
          shell: bash
          extra_args: -e GITHUB_TOKEN
          command: |
            make clean deps lint package publish
        env:
          # gh creates the GitHub release, which the read-only GITHUB_TOKEN can't
          GITHUB_TOKEN: ${{ secrets.SHINEOPENSOURCE_GITHUB_TOKEN }}
